<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">SUNO-GENERATION-OPTIMIZER: システム構想</title><desc id="desc">歌詞設計、楽曲要求と予算承認、Suno MCP生成、独立検査、必須要求判定、人の採用承認、下流制作。失敗時は承認付き条件修正、未確定時は停止。要件定義段階。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#7d94ac"/></marker><marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 6 L0 12 Z" fill="#ffbc73"/></marker><marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 6 L0 12 Z" fill="#73e2b1"/></marker></defs>
<g font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, Meiryo, Arial, sans-serif">
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0b1728" stroke="none" stroke-width="2"/>
<path d="M0 0H1920V8H0Z" fill="#76d7e5"/>
<text x="65" y="63" font-size="25" font-weight="700" fill="#76d7e5" text-anchor="start">GACKY-LAB  /  AI MUSIC ENGINEERING</text>
<rect x="1400" y="28" width="455" height="47" rx="23" fill="#392d25" stroke="#785638" stroke-width="2"/><text x="1628" y="60" font-size="24" font-weight="700" fill="#ffbc73" text-anchor="middle">要件定義公開  /  実機未検証</text>
<text x="62" y="145" font-size="68" font-weight="800" fill="#f4f8ff" text-anchor="start">SUNO-GENERATION-OPTIMIZER</text>
<text x="65" y="207" font-size="42" font-weight="700" fill="#e4edf8" text-anchor="start">生成AI音楽を、要求・検査・改善で制御する。</text>
<text x="65" y="244" font-size="24" font-weight="500" fill="#a9bfd3" text-anchor="start">Closed-loop music generation  /  Requirements-driven verification  /  Budget-bounded experiments</text>
<rect x="65" y="300" width="310" height="222" rx="18" fill="#14263b" stroke="#344d64" stroke-width="2"/><text x="87" y="332" font-size="19" font-weight="700" fill="#76d7e5" text-anchor="start">01  /  INPUT</text><text x="87" y="371" font-size="30" font-weight="750" fill="#f3f7ff" text-anchor="start">LYRIC DESIGN</text><text x="87" y="408" font-size="27" font-weight="700" fill="#f3f7ff" text-anchor="start">歌詞・要求仕様</text><text x="87" y="451" font-size="22" font-weight="500" fill="#adbed0" text-anchor="start">原文・版・SHA-256</text><text x="87" y="481" font-size="22" font-weight="500" fill="#adbed0" text-anchor="start">BPM / 曲長 / 歌詞</text>
<rect x="435" y="300" width="310" height="222" rx="18" fill="#14263b" stroke="#344d64" stroke-width="2"/><text x="457" y="332" font-size="19" font-weight="700" fill="#76d7e5" text-anchor="start">02  /  CONTROL</text><text x="457" y="371" font-size="30" font-weight="750" fill="#f3f7ff" text-anchor="start">PLAN &amp; APPROVE</text><text x="457" y="408" font-size="27" font-weight="700" fill="#f3f7ff" text-anchor="start">予算・生成条件</text><text x="457" y="451" font-size="22" font-weight="500" fill="#adbed0" text-anchor="start">クレジット / 回数上限</text><text x="457" y="481" font-size="22" font-weight="500" fill="#adbed0" text-anchor="start">認可・送信内容承認</text>
<rect x="805" y="300" width="310" height="222" rx="18" fill="#14263b" stroke="#344d64" stroke-width="2"/><text x="827" y="332" font-size="19" font-weight="700" fill="#bfadff" text-anchor="start">03  /  GENERATE</text><text x="827" y="371" font-size="30" font-weight="750" fill="#f3f7ff" text-anchor="start">SUNO MCP</text><text x="827" y="408" font-size="27" font-weight="700" fill="#f3f7ff" text-anchor="start">公式MCP連携</text><text x="827" y="451" font-size="22" font-weight="500" fill="#adbed0" text-anchor="start">能力・スキーマ確認</text><text x="827" y="481" font-size="22" font-weight="500" fill="#adbed0" text-anchor="start">生成 / 候補 / 素材取得</text>
<rect x="1175" y="300" width="310" height="222" rx="18" fill="#14263b" stroke="#344d64" stroke-width="2"/><text x="1197" y="332" font-size="19" font-weight="700" fill="#76d7e5" text-anchor="start">04  /  VERIFY</text><text x="1197" y="371" font-size="30" font-weight="750" fill="#f3f7ff" text-anchor="start">INDEPENDENT QA</text><text x="1197" y="408" font-size="27" font-weight="700" fill="#f3f7ff" text-anchor="start">独立検査</text><text x="1197" y="451" font-size="22" font-weight="500" fill="#adbed0" text-anchor="start">音響測定・歌詞照合</text><text x="1197" y="481" font-size="22" font-weight="500" fill="#adbed0" text-anchor="start">Suno解析とは別記録</text>
<rect x="1545" y="300" width="310" height="222" rx="18" fill="#14263b" stroke="#344d64" stroke-width="2"/>
<text x="1567" y="332" font-size="19" font-weight="700" fill="#73e2b1" text-anchor="start">05  /  GATE</text>
<text x="1567" y="371" font-size="29" font-weight="750" fill="#f3f7ff" text-anchor="start">REQUIREMENTS</text>
<text x="1567" y="408" font-size="27" font-weight="700" fill="#f3f7ff" text-anchor="start">必須要求判定</text>
<text x="1567" y="451" font-size="20" font-weight="650" fill="#c2d3e1" text-anchor="start">PASS / FAIL / UNKNOWN</text>
<text x="1567" y="481" font-size="22" font-weight="500" fill="#adbed0" text-anchor="start">必須NGを相殺しない</text>
<path d="M382 410 H426" fill="none" stroke="#7d94ac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M752 410 H796" fill="none" stroke="#7d94ac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1122 410 H1166" fill="none" stroke="#7d94ac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1492 410 H1536" fill="none" stroke="#7d94ac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1700 522 V557 H1710 V585" fill="none" stroke="#73e2b1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="1730" y="558" font-size="20" font-weight="700" fill="#73e2b1" text-anchor="start">PASS</text>
<rect x="1445" y="585" width="410" height="121" rx="18" fill="#17362f" stroke="#397d68" stroke-width="2"/>
<text x="1471" y="619" font-size="28" font-weight="750" fill="#d9ffef" text-anchor="start">人による採用承認</text>
<text x="1471" y="655" font-size="24" font-weight="700" fill="#73e2b1" text-anchor="start">AI-VOCALOID-STUDIO</text>
<text x="1471" y="685" font-size="22" font-weight="500" fill="#d2e9df" text-anchor="start">承認済み素材を下流制作へ</text>
<path d="M1585 522 V548 H1065 V585" fill="none" stroke="#ffbc73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<text x="1120" y="541" font-size="20" font-weight="700" fill="#ffbc73" text-anchor="start">FAIL / 上限内</text>
<rect x="435" y="585" width="765" height="121" rx="18" fill="#362b28" stroke="#94663f" stroke-width="2"/>
<text x="461" y="620" font-size="29" font-weight="750" fill="#ffce9b" text-anchor="start">FEEDBACK  /  条件修正 → 再生成</text>
<text x="461" y="656" font-size="24" font-weight="500" fill="#f1e2d6" text-anchor="start">不合格理由から原則1因子ずつ修正。歌詞原文を保持。</text>
<text x="461" y="686" font-size="23" font-weight="500" fill="#f1e2d6" text-anchor="start">承認・予算確認後のみ再生成。上限到達で停止。</text>
<path d="M435 645 H405 V561 H590 V530" fill="none" stroke="#ffbc73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<rect x="65" y="585" width="310" height="121" rx="18" fill="#17283b" stroke="#344d64" stroke-width="2"/>
<text x="86" y="622" font-size="25" font-weight="700" fill="#f3f7ff" text-anchor="start">STOP / REVIEW</text>
<text x="86" y="656" font-size="22" font-weight="500" fill="#adbed0" text-anchor="start">UNKNOWN・費用不明</text>
<text x="86" y="685" font-size="22" font-weight="500" fill="#adbed0" text-anchor="start">結果不明時は再送禁止</text>
<rect x="65" y="742" width="1790" height="117" rx="18" fill="#102d3c" stroke="#2e6377" stroke-width="2"/>
<text x="89" y="778" font-size="26" font-weight="750" fill="#76d7e5" text-anchor="start">EVIDENCE  /  DVP・DVR</text>
<text x="89" y="823" font-size="28" font-weight="600" fill="#e4edf8" text-anchor="start">要求ID・検査結果・全候補・費用・変更履歴・失敗 / 欠測を記録</text>
<rect x="1334" y="762" width="495" height="76" rx="12" fill="#173d4c" stroke="#3f7182" stroke-width="2"/>
<text x="1356" y="791" font-size="21" font-weight="700" fill="#e4edf8" text-anchor="start">研究仮説：同一予算で適合率は改善するか</text>
<text x="1356" y="819" font-size="22" font-weight="500" fill="#a9dbe3" text-anchor="start">固定指示 vs 条件修正  ／  未実証</text>
<rect x="65" y="882" width="425" height="104" rx="12" fill="#14263b" stroke="#344d64" stroke-width="2"/><text x="84" y="918" font-size="26" font-weight="750" fill="#76d7e5" text-anchor="start">P0</text><text x="143" y="918" font-size="27" font-weight="700" fill="#f3f7ff" text-anchor="start">オフライン検証</text><text x="84" y="958" font-size="23" font-weight="500" fill="#adbed0" text-anchor="start">Mock / Python / CI</text><rect x="520" y="882" width="425" height="104" rx="12" fill="#14263b" stroke="#344d64" stroke-width="2"/><text x="539" y="918" font-size="26" font-weight="750" fill="#76d7e5" text-anchor="start">P1</text><text x="598" y="918" font-size="27" font-weight="700" fill="#f3f7ff" text-anchor="start">公式MCP実機</text><text x="539" y="958" font-size="23" font-weight="500" fill="#adbed0" text-anchor="start">認可・1回生成</text><rect x="975" y="882" width="425" height="104" rx="12" fill="#14263b" stroke="#344d64" stroke-width="2"/><text x="994" y="918" font-size="26" font-weight="750" fill="#76d7e5" text-anchor="start">P2</text><text x="1053" y="918" font-size="27" font-weight="700" fill="#f3f7ff" text-anchor="start">閉ループ比較</text><text x="994" y="958" font-size="23" font-weight="500" fill="#adbed0" text-anchor="start">予算内反復 / A-B</text><rect x="1430" y="882" width="425" height="104" rx="12" fill="#14263b" stroke="#344d64" stroke-width="2"/><text x="1449" y="918" font-size="26" font-weight="750" fill="#76d7e5" text-anchor="start">P3</text><text x="1508" y="918" font-size="27" font-weight="700" fill="#f3f7ff" text-anchor="start">研究拡張</text><text x="1449" y="958" font-size="23" font-weight="500" fill="#adbed0" text-anchor="start">MIDI・差分・ステム</text>
<text x="65" y="1030" font-size="22" font-weight="600" fill="#a9bfd3" text-anchor="start">Gacky-Lab  •  SGO-SRS-001 v0.1.0  •  2026-11-25 JST</text>
<text x="1855" y="1030" font-size="21" font-weight="500" fill="#a9bfd3" text-anchor="end">独立研究 / Suno非公式プロジェクト / 実装・性能実証は未実施</text>
</g></svg>