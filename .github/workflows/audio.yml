name: Independent audio tests
on:
  push:
    branches: [main]
    paths: ['independent_qa.py', 'requirements-audio.txt', 'tests/test_independent_qa.py', '.github/workflows/audio.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SGO_REQUIRE_AUDIO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-audio.txt
      - run: python -m unittest discover -s tests -p test_independent_qa.py -v
