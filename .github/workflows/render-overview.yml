name: Render system overview PNG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/overview-16x9.html'
      - 'images/overview-16x9.svg'
      - '.github/workflows/render-overview.yml'
permissions:
  contents: write
concurrency:
  group: render-overview-main
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer and Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-noto-cjk
      - name: Validate source and render 16:9 PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          html = Path("docs/overview-16x9.html").read_text()
          svg = Path("images/overview-16x9.svg").read_text()
          embedded = html[html.index("<svg "):html.index("</svg>")+6]
          assert embedded == svg, "HTML and SVG differ"
          root = ET.fromstring(svg)
          assert root.attrib["viewBox"] == "0 0 1920 1080"
          PY
          rsvg-convert -w 1920 -h 1080 images/overview-16x9.svg -o images/overview-16x9.png
          python - <<'PY'
          from pathlib import Path
          import struct
          p = Path("images/overview-16x9.png").read_bytes()
          assert p[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II", p[16:24]) == (1920,1080)
          print("PNG validated: 1920x1080")
          PY
      - name: Commit rendered PNG only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/overview-16x9.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: render 1920x1080 overview PNG"
          git push origin HEAD:main
