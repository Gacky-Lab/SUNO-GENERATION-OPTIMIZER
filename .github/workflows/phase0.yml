name: Phase-0 offline tests
on:
  push:
    branches: [main]
    paths:
      - 'suno_optimizer.py'
      - 'live_evidence.py'
      - 'p2_pilot.py'
      - 'tests/**'
      - 'fixtures/**'
      - 'requirements-dev.txt'
      - '.github/workflows/phase0.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python suno_optimizer.py inspect fixtures/mcp_observed_subset.mock.json
      - run: python p2_pilot.py fixtures/p2_pilot_provider_results.json
